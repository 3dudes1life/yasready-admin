/* === BUSINESS 360 BUILD 4 === */
/* Fix health score circles: fixed square sizing + no shrink + true circular ring */
.healthScore{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.healthCircle{
  --score:50;
  width:58px!important;height:58px!important;min-width:58px!important;min-height:58px!important;
  aspect-ratio:1/1!important;flex:0 0 58px!important;border-radius:50%!important;
  display:grid!important;place-items:center!important;position:relative!important;overflow:hidden!important;
  background:conic-gradient(#6c55ff calc(var(--score)*1%),#e9e9ee 0)!important;
}
.healthCircle:after{content:"";position:absolute!important;inset:7px!important;background:#fff!important;border-radius:50%!important}
.healthCircle strong{position:relative!important;z-index:2!important;font-size:12px!important;line-height:1!important;white-space:nowrap!important}
.healthCopy{min-width:0}.healthCopy strong{overflow:hidden;text-overflow:ellipsis;white-space:normal;line-height:1.15}
.kpiStrip{align-items:stretch}.kpiMini{min-width:0;overflow:hidden}

/* ============================================================
   BUSINESS 360 BUILD 5 — ADMIN API ABSTRACTION
   UI code should consume AdminAPI rather than caring where data lives.

const API_MODE_KEY="yasready_admin_api_mode";
let apiMode=localStorage.getItem(API_MODE_KEY)||"mock";
let apiState={latency:120,failNext:false,offline:false};

const AdminAPI={
  async wait(){if(apiState.offline)throw new Error("OFFLINE");await new Promise(r=>setTimeout(r,apiState.latency));if(apiState.failNext){apiState.failNext=false;throw new Error("SIMULATED_API_FAILURE")}},
  async getOverview(){await this.wait();return {mrr:1184,businesses:141,accounts:128,paidConversion:31.3,needsAttention:7}},

  async getAnnouncements(){await this.wait();return structuredClone(adminState.announcements)},

function setApiMode(mode){if(!["mock","slow","offline"].includes(mode))mode="mock";apiMode=mode;localStorage.setItem(API_MODE_KEY,mode);apiState.offline=mode==="offline";document.getElementById("offlineBanner")?.classList.toggle("show",apiState.offline)}

const IPAD_MODE_KEY="yasready_admin_ipad_mode";
function applyIpadMode(on){
  document.body.classList.toggle("ipadMode",!!on);
  localStorage.setItem(IPAD_MODE_KEY,on?"1":"0");
  const btn=document.getElementById("ipadModeToggle");
  if(btn){btn.classList.toggle("active",!!on);btn.textContent=on?"Desktop Mode":"iPad Mode"}
}
function toggleIpadMode(){applyIpadMode(!document.body.classList.contains("ipadMode"))}
document.getElementById("ipadModeToggle")?.addEventListener("click",toggleIpadMode);
document.querySelectorAll("[data-dock]").forEach(b=>b.onclick=()=>navigate(b.dataset.dock));
const savedIpad=localStorage.getItem(IPAD_MODE_KEY)==="1";
applyIpadMode(savedIpad);

/* Offer iPad mode automatically on tablet-like widths without forcing it. */
if(!localStorage.getItem(IPAD_MODE_KEY) && window.matchMedia("(min-width:700px) and (max-width:1180px)").matches){
  const btn=document.getElementById("ipadModeToggle");
  if(btn){btn.textContent="Try iPad Mode";btn.title="This layout looks like an iPad-sized browser. Tap to optimize YasReady Admin for touch."}
}


function hardenRoleUI(){
  const role=document.getElementById("roleSelect")?.value||"Owner";
  const perms=typeof currentPerm==="function"?currentPerm():{billing:true,mutate:true,support:true,flags:true,roles:true,export:true};
  document.querySelectorAll("[data-requires]").forEach(el=>{
    const req=el.dataset.requires;
    const allowed=!!perms[req];
    if("disabled" in el) el.disabled=!allowed;
    el.setAttribute("aria-disabled",allowed?"false":"true");
    el.title=allowed?"":role+" does not have permission for this action.";
  });
  document.getElementById("rolePageWarning")?.remove();
  if(role==="Read Only"){
    const n=document.createElement("div");
    n.id="rolePageWarning";
    n.className="roleWarning";
    n.textContent="Read Only mode: actions that change customer or admin data are disabled.";
    content.prepend(n);
  }
}

async function navigate(v){

 const loaders={
   overview:()=>AdminAPI.getOverview(),
   customers:()=>AdminAPI.getCustomers(),
   businesses:()=>AdminAPI.getBusinesses(),
   revenue:()=>AdminAPI.getRevenue(),
   subscriptions:()=>AdminAPI.getSubscriptions(),
   support:()=>AdminAPI.getSupportThreads(),
   analytics:()=>AdminAPI.getAnalytics(),
   success:()=>AdminAPI.getCustomerSuccess(),
   feedback:()=>AdminAPI.getFeedback(),
   content:()=>AdminAPI.getAnnouncements(),
   operations:()=>AdminAPI.getOperations(),
   settings:()=>AdminAPI.getFeatureFlags(),
   architecture:()=>AdminAPI.getContract(),
   health:()=>Promise.resolve({ok:true})
 };
 if(loaders[v]){
   renderLoading("Loading "+v.replace(/([A-Z])/g," $1")+"…");
   try{await loaders[v]()}catch(err){renderApiError(err,v);return}
 }
 ({overview,customers,businesses:businessesView,revenue,subscriptions,support,analytics,success,feedback,health,content:contentAdmin,operations,architecture,settings}[v]||overview)();
 bindJumps();setTimeout(()=>{enforceRoleUI();hardenRoleUI()},0)
}
