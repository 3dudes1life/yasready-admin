<!doctype html>
<html lang="en" data-yr-module="admin">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YasReady Admin — Business 360</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#171719;--muted:#77777f;--line:#e7e7eb;--accent:#6c55ff;--lime:#dfff7d;--good:#eaf8d7;--warn:#fff4d7;--bad:#ffe6e6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh}.top{height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{font-weight:900;letter-spacing:-.04em;font-size:21px}.brand span{color:var(--accent)}.adminPill{margin-left:9px;font-size:10px;font-weight:900;background:#171719;color:white;padding:6px 8px;border-radius:999px}.topRight{margin-left:auto;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#171719;color:#fff;display:grid;place-items:center;font-weight:900}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr)}aside{padding:20px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px);background:#fafafa;position:sticky;top:68px;height:calc(100vh - 68px)}
.navTitle{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#999;font-weight:850;margin:14px 10px 7px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:11px;color:#555;cursor:pointer;font-weight:700;font-size:13px}.nav button:hover,.nav button.active{background:#fff;color:#171719;box-shadow:0 1px 0 rgba(0,0,0,.05)}.nav .count{float:right;background:#eeeef1;padding:2px 6px;border-radius:999px;font-size:10px}
main{padding:30px;max-width:1500px;width:100%;margin:auto}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--accent)}h1{font-size:clamp(34px,4vw,54px);letter-spacing:-.055em;line-height:1;margin:8px 0 10px}h2{letter-spacing:-.035em}.sub{color:var(--muted);max-width:760px;line-height:1.55}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.metric span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#888;font-weight:850}.metric strong{display:block;font-size:28px;margin-top:7px;letter-spacing:-.04em}.metric small{display:block;color:#888;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 12px}.sectionHead h2{margin:0}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#171719;color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.ghost{background:transparent;color:var(--accent)}
.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{text-align:left;padding:13px 14px;border-bottom:1px solid #eee;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#888}.table tr:last-child td{border-bottom:0}.clickrow{cursor:pointer}.clickrow:hover{background:#fafafa}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:850;background:#f0efff;color:#5c48dd}.pill.free{background:#eee;color:#555}.pill.good{background:var(--good);color:#4c6200}.pill.warn{background:var(--warn);color:#755d00}.pill.bad{background:var(--bad);color:#8a3131}
.search{display:flex;gap:8px}.search input,.field input,.field select,.field textarea{width:100%;border:1px solid #dddde2;border-radius:11px;padding:10px 11px;background:#fff}.search input{min-width:240px}
.progress{height:8px;background:#ededf0;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#171719;border-radius:999px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row strong{font-size:12px}.row span{font-size:11px;color:#888}
.inbox{display:grid;grid-template-columns:330px 1fr;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;min-height:620px}.threads{border-right:1px solid var(--line);overflow:auto}.thread{padding:15px;border-bottom:1px solid #eee;cursor:pointer}.thread:hover,.thread.active{background:#f8f7ff}.thread strong{display:block;font-size:12px}.thread p{font-size:11px;color:#777;margin:5px 0}.thread small{color:#999}.chat{display:grid;grid-template-rows:auto 1fr auto}.chatHead{padding:16px;border-bottom:1px solid var(--line)}.messages{padding:20px;display:flex;flex-direction:column;gap:10px;overflow:auto}.bubble{max-width:75%;padding:11px 13px;border-radius:15px;background:#f0f0f2;font-size:12px;line-height:1.45}.bubble.admin{margin-left:auto;background:#171719;color:#fff}.composer{padding:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.composer textarea{resize:none;border:1px solid #ddd;border-radius:12px;padding:11px;min-height:54px}
.hero360{background:linear-gradient(145deg,#171719,#272532 65%,#38305d);color:#fff;border-radius:26px;padding:28px}.hero360 .sub{color:#bbb}.heroTop{display:flex;justify-content:space-between;gap:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:999px;font-weight:800;font-size:11px;cursor:pointer}.tabs button.active{background:#171719;color:#fff;border-color:#171719}.note textarea{width:100%;min-height:100px;border:1px solid #ddd;border-radius:12px;padding:11px;resize:vertical}
.bar{display:grid;grid-template-columns:140px 1fr 50px;gap:10px;align-items:center;margin:10px 0}.bar label{font-size:11px;color:#666}.bar .track{height:9px;background:#eee;border-radius:999px;overflow:hidden}.bar .track i{display:block;height:100%;background:#171719}
.notice{background:#fffbea;border:1px solid #eee0aa;border-radius:14px;padding:13px;font-size:12px;color:#715e1e;line-height:1.5}
.mobileMenu{display:none}
@media(max-width:1050px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.layout{grid-template-columns:190px 1fr}.inbox{grid-template-columns:280px 1fr}}
@media(max-width:760px){.layout{display:block}aside{display:none}.mobileMenu{display:block}.grid4,.grid3,.grid2{grid-template-columns:1fr}main{padding:20px}.inbox{grid-template-columns:1fr}.threads{border-right:0;max-height:260px}.search input{min-width:0}.heroTop{display:block}.top .adminPill{display:none}}
</style>
<script src="yasready-cloud-config.js"></script><script src="yasready-cloud-client.js"></script><script src="yasready-platform-shell.js"></script></head>
<body><div class="app">
<header class="top"><div class="brand">YasReady<span>.</span></div><div class="adminPill">ADMIN · BUSINESS 360 BUILD 1</div>
<div class="topRight"><select id="roleSelect" class="secondary btn"><option>Owner</option><option>Admin</option><option>Support</option><option>Read Only</option></select><div class="avatar">W</div></div></header>
<div class="layout"><aside><div class="nav">
<div class="navTitle">Command Center</div>
<button data-view="overview" class="active">Overview</button><button data-view="customers">Customers <span class="count">128</span></button><button data-view="businesses">Businesses <span class="count">141</span></button>
<div class="navTitle">Money</div><button data-view="revenue">Revenue</button><button data-view="subscriptions">Subscriptions</button>
<div class="navTitle">Customer Success</div><button data-view="support">Support Inbox <span class="count">4</span></button>
<div class="navTitle">Intelligence</div><button data-view="analytics">Product Analytics</button><button data-view="health">System Health</button>
<div class="navTitle">Admin</div><button data-view="settings">Settings</button>
</div></aside><main id="content"></main></div></div>
<script>
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
const plans={free:"Free",run:"$9.99 Run",connect:"$19.99 Connect"};
const businesses=[
{id:1,name:"YasReady",owner:"William Z.",email:"william@example.com",plan:"connect",ready:92,revenue:8200,goal:10000,last:"Today",status:"Active",customers:38,offers:3,kpis:9,google:"Connected",support:1,description:"Small-business launch and operating platform.",industry:"SaaS"},
{id:2,name:"Maya Makes Studio",owner:"Maya Chen",email:"maya@example.com",plan:"run",ready:81,revenue:4600,goal:6000,last:"Today",status:"Active",customers:24,offers:5,kpis:7,google:"Not included",support:0,description:"Custom illustration and creative services.",industry:"Creative"},
{id:3,name:"Northside Mobile Detail",owner:"Andre Lewis",email:"andre@example.com",plan:"run",ready:74,revenue:7100,goal:8000,last:"Yesterday",status:"Active",customers:31,offers:4,kpis:6,google:"Not included",support:1,description:"Mobile automotive detailing.",industry:"Services"},
{id:4,name:"Sunday Bloom Co.",owner:"Rina Patel",email:"rina@example.com",plan:"free",ready:56,revenue:0,goal:3500,last:"2 days ago",status:"Active",customers:0,offers:2,kpis:3,google:"Locked",support:1,description:"Local floral arrangements and events.",industry:"Retail"},
{id:5,name:"Trailhead Bookkeeping",owner:"Jordan Kim",email:"jordan@example.com",plan:"connect",ready:96,revenue:12800,goal:12000,last:"Today",status:"Active",customers:19,offers:3,kpis:10,google:"Connected",support:0,description:"Bookkeeping for independent businesses.",industry:"Finance"},
{id:6,name:"Glow Reiki",owner:"Daniel C.",email:"daniel@example.com",plan:"free",ready:68,revenue:1250,goal:3000,last:"5 days ago",status:"Active",customers:8,offers:2,kpis:4,google:"Locked",support:1,description:"Reiki sessions and wellness services.",industry:"Wellness"}
];
const threads=[
{id:1,biz:1,name:"William · YasReady",subject:"Why is my gross margin different?",status:"New",time:"8m",messages:[["customer","My gross margin looks different than the number I expected. Can you tell me what YasReady is using?"],["admin","Absolutely — I can see the pricing and direct-cost inputs attached to this business. I’m checking the calculation with you."]]},
{id:2,biz:3,name:"Andre · Northside Mobile Detail",subject:"Revenue goal question",status:"Waiting on us",time:"31m",messages:[["customer","Should my monthly revenue goal include tips?" ]]},
{id:3,biz:4,name:"Rina · Sunday Bloom Co.",subject:"Where do I add delivery cost?",status:"New",time:"1h",messages:[["customer","I charge delivery sometimes. Is that an expense or part of the offer?"]]},
{id:4,biz:6,name:"Daniel · Glow Reiki",subject:"Can I change my launch date?",status:"Waiting on us",time:"3h",messages:[["customer","I need to move the launch date. Where do I edit it?"]]}
];
const events=["Maya completed monthly check-in","Trailhead Bookkeeping upgraded to Connect","Andre opened KPI Levers","Sunday Bloom completed Offer + Price","YasReady logged a business win"];
let current="overview", selectedBiz=businesses[0], selectedThread=threads[0];
const content=document.getElementById("content");
function metric(label,value,small=""){return `<div class="metric"><span>${label}</span><strong>${value}</strong><small>${small}</small></div>`}
function tableBiz(rows=businesses){return `<div class="tableWrap"><table class="table"><thead><tr><th>Business</th><th>Owner</th><th>Plan</th><th>Readiness</th><th>Revenue</th><th>Goal</th><th>Last active</th></tr></thead><tbody>${rows.map(b=>`<tr class="clickrow" data-biz="${b.id}"><td><strong>${b.name}</strong><br><small>${b.industry}</small></td><td>${b.owner}</td><td><span class="pill ${b.plan==="free"?"free":""}">${plans[b.plan]}</span></td><td>${b.ready}%</td><td>${money(b.revenue)}</td><td>${money(b.goal)}</td><td>${b.last}</td></tr>`).join("")}</tbody></table></div>`}
function overview(){content.innerHTML=`<span class="eyebrow">YasReady Command Center</span><h1>Run the company.</h1><p class="sub">A single view of customers, businesses, revenue, support, product usage, and anything that needs attention.</p>
<div class="grid4">${metric("MRR","$1,184","+12.4% this month")}${metric("Businesses","141","128 customer accounts")}${metric("Paid conversion","31.3%","Free → paid")}${metric("Needs attention","7","4 support · 3 billing")}</div>
<div class="grid2"><section class="card"><div class="sectionHead"><h2>Needs attention</h2></div><div class="list"><div class="row"><strong>4 support conversations</strong><span class="pill warn">Reply</span></div><div class="row"><strong>2 failed payments</strong><span class="pill bad">Billing</span></div><div class="row"><strong>1 business stalled in setup</strong><span class="pill">Success</span></div><div class="row"><strong>3 Connect users not connected to Google</strong><span>Opportunity</span></div></div></section>
<section class="card"><div class="sectionHead"><h2>Live activity</h2></div><div class="list">${events.map((e,i)=>`<div class="row"><strong>${e}</strong><span>${i*7+3}m ago</span></div>`).join("")}</div></section></div>
<div class="sectionHead"><h2>Recently active businesses</h2><button class="btn secondary" data-jump="businesses">View all</button></div>${tableBiz(businesses.slice(0,5))}`;bindRows()}
function businessesView(){content.innerHTML=`<span class="eyebrow">Businesses</span><h1>Every business.</h1><p class="sub">Open Business 360 to see the exact customer context behind their plan, numbers, activity, subscription, and support.</p><div class="sectionHead"><div class="search"><input id="bizSearch" placeholder="Search business or owner…"></div><button class="btn secondary">Export view</button></div><div id="bizTable">${tableBiz()}</div>`;bindRows();document.getElementById("bizSearch").oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById("bizTable").innerHTML=tableBiz(businesses.filter(b=>(b.name+b.owner+b.email).toLowerCase().includes(q)));bindRows()}}
function customers(){content.innerHTML=`<span class="eyebrow">Customers</span><h1>Customer CRM.</h1><p class="sub">Account-level view for plan, businesses, support load, and activity.</p><div class="grid4">${metric("Accounts","128","141 businesses")}${metric("Active 7d","94","73.4%")}${metric("Paid","40","31.3%")}${metric("Support open","4","3 new")}</div>${tableBiz()}`;bindRows()}
function business360(b){selectedBiz=b;content.innerHTML=`<button class="btn ghost" data-jump="businesses">← Businesses</button><section class="hero360"><div class="heroTop"><div><span class="eyebrow" style="color:var(--lime)">Business 360</span><h1>${b.name}</h1><p class="sub">${b.description}</p></div><div><span class="pill ${b.plan==="free"?"free":""}">${plans[b.plan]}</span></div></div></section>
<div class="grid4">${metric("Readiness",b.ready+"%","Business setup")}${metric("Monthly revenue",money(b.revenue),"Goal "+money(b.goal))}${metric("Customers",b.customers,"Latest actuals")}${metric("KPIs",b.kpis,"Currently calculable")}</div>
<div class="tabs"><button class="active">Overview</button><button>Workspace</button><button>KPIs</button><button>Financials</button><button>Activity</button><button>Support</button><button>Subscription</button></div>
<div class="grid2"><section class="card"><span class="eyebrow">Customer</span><h2>${b.owner}</h2><div class="list"><div class="row"><strong>Email</strong><span>${b.email}</span></div><div class="row"><strong>Industry</strong><span>${b.industry}</span></div><div class="row"><strong>Last active</strong><span>${b.last}</span></div><div class="row"><strong>Google</strong><span>${b.google}</span></div><div class="row"><strong>Open support</strong><span>${b.support}</span></div></div></section>
<section class="card"><span class="eyebrow">Business health</span><h2>Plan vs. actual</h2><div class="bar"><label>Revenue goal</label><div class="track"><i style="width:${Math.min(100,b.revenue/b.goal*100)}%"></i></div><strong>${Math.round(b.revenue/b.goal*100)}%</strong></div><div class="bar"><label>Readiness</label><div class="track"><i style="width:${b.ready}%"></i></div><strong>${b.ready}%</strong></div><div class="bar"><label>KPI coverage</label><div class="track"><i style="width:${b.kpis*10}%"></i></div><strong>${b.kpis}/10</strong></div></section></div>
<div class="grid3" style="margin-top:14px"><section class="card"><span class="eyebrow">Offers</span><h2>${b.offers} active</h2><p class="sub">Pricing and offer data visible to support/admin according to role.</p></section><section class="card"><span class="eyebrow">Subscription</span><h2>${plans[b.plan]}</h2><p class="sub">Active · next billing mock date Sep 16.</p></section><section class="card"><span class="eyebrow">Support context</span><h2>${b.support?"Needs reply":"Clear"}</h2><button class="btn secondary" data-jump="support">Open inbox</button></section></div>
<section class="card note" style="margin-top:14px"><span class="eyebrow">Internal notes</span><h2>Admin-only context</h2><textarea id="internalNote" placeholder="Notes customers never see…"></textarea><button class="btn primary" style="margin-top:8px" onclick="alert('Saved locally in mock admin.')">Save note</button></section>`;bindJumps()}
function revenue(){content.innerHTML=`<span class="eyebrow">Revenue</span><h1>Money flow.</h1><p class="sub">Mock financial command center now; later this will reconcile subscription events and Stripe billing through the same backend.</p><div class="grid4">${metric("MRR","$1,184","+12.4%")}${metric("ARR","$14,208","Run-rate")}${metric("ARPU","$29.60","Paid accounts")}${metric("Failed","$39.98","2 payments")}</div><div class="grid2"><section class="card"><h2>Plan revenue</h2><div class="list"><div class="row"><strong>Run YasReady</strong><span>$619/mo</span></div><div class="row"><strong>Connect YasReady</strong><span>$565/mo</span></div></div></section><section class="card"><h2>Growth</h2><div class="bar"><label>Free → paid</label><div class="track"><i style="width:31%"></i></div><strong>31%</strong></div><div class="bar"><label>Run → Connect</label><div class="track"><i style="width:22%"></i></div><strong>22%</strong></div></section></div>`}
function subscriptions(){content.innerHTML=`<span class="eyebrow">Subscriptions</span><h1>Plans & billing.</h1><div class="grid4">${metric("Free","88","68.7%")}${metric("$9.99 Run","24","18.8%")}${metric("$19.99 Connect","16","12.5%")}${metric("Churn","2.1%","Mock 30d")}</div>${tableBiz()}`;bindRows()}
function support(){content.innerHTML=`<span class="eyebrow">Support</span><h1>Talk where the business lives.</h1><p class="sub">Mock inbox for the future customer ↔ admin conversation layer. Customer context remains one click away.</p><div class="inbox"><div class="threads">${threads.map(t=>`<div class="thread ${t.id===selectedThread.id?"active":""}" data-thread="${t.id}"><strong>${t.name}</strong><p>${t.subject}</p><small>${t.status} · ${t.time}</small></div>`).join("")}</div><div class="chat"><div class="chatHead"><strong>${selectedThread.name}</strong><br><small>${selectedThread.subject}</small> <button class="btn ghost" id="openContext">Open Business 360</button></div><div class="messages">${selectedThread.messages.map(m=>`<div class="bubble ${m[0]==="admin"?"admin":""}">${m[1]}</div>`).join("")}</div><div class="composer"><textarea id="reply" placeholder="Reply to customer…"></textarea><button class="btn primary" id="sendReply">Send</button></div></div></div>`;
document.querySelectorAll("[data-thread]").forEach(x=>x.onclick=()=>{selectedThread=threads.find(t=>t.id==x.dataset.thread);support()});document.getElementById("openContext").onclick=()=>business360(businesses.find(b=>b.id===selectedThread.biz));document.getElementById("sendReply").onclick=()=>{const r=document.getElementById("reply");if(!r.value.trim())return;selectedThread.messages.push(["admin",r.value.trim()]);selectedThread.status="Waiting on customer";support()}}
function analytics(){content.innerHTML=`<span class="eyebrow">Product Intelligence</span><h1>How people use YasReady.</h1><div class="grid4">${metric("Onboarding complete","82%","+4.2 pts")}${metric("Monthly check-in","47%","Paid users")}${metric("Today weekly use","63%","Active businesses")}${metric("KPI engagement","71%","Run + Connect")}</div><div class="grid2"><section class="card"><h2>Setup funnel</h2>${[["Business basics",96],["Offer + price",88],["Costs + goal",76],["Launch / performance",62]].map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><i style="width:${x[1]}%"></i></div><strong>${x[1]}%</strong></div>`).join("")}</section><section class="card"><h2>Feature usage</h2>${[["Today",63],["KPIs",71],["Financial Model",54],["Excel export",29],["Business 101",41]].map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><i style="width:${x[1]}%"></i></div><strong>${x[1]}%</strong></div>`).join("")}</section></div>`}
function health(){content.innerHTML=`<span class="eyebrow">System Health</span><h1>Know before customers do.</h1><div class="grid4">${metric("API","Healthy","Mock")}${metric("Database","Healthy","Mock D1")}${metric("Support realtime","Ready","Mock architecture")}${metric("Errors","0","Current local build")}</div><div class="notice">No production services are connected in Business 360 Build 1. These health cards intentionally represent the future monitoring surface, not fake live infrastructure.</div>`}
function settings(){content.innerHTML=`<span class="eyebrow">Admin Settings</span><h1>Control the office.</h1><div class="grid2"><section class="card"><h2>Admin role simulator</h2><p class="sub">Use the role selector in the top-right to preview Owner, Admin, Support, and Read Only concepts before real authentication exists.</p></section><section class="card"><h2>Backend status</h2><div class="list"><div class="row"><strong>Customer API</strong><span class="pill warn">Not connected</span></div><div class="row"><strong>Cloudflare D1</strong><span class="pill warn">Not connected</span></div><div class="row"><strong>Billing</strong><span class="pill warn">Mock only</span></div><div class="row"><strong>Realtime support</strong><span class="pill warn">Mock only</span></div></div></section></div><section class="card" style="margin-top:14px"><h2>Architecture contract</h2><p class="sub">Admin, customer web, iOS, and Android should consume the same YasReady API. This admin frontend remains a separate deployment and never ships inside the customer repository.</p></section>`}
function bindRows(){document.querySelectorAll("[data-biz]").forEach(r=>r.onclick=()=>business360(businesses.find(b=>b.id==r.dataset.biz)));bindJumps()}
function bindJumps(){document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>navigate(b.dataset.jump))}
function navigate(v){current=v;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));({overview,customers,businesses:businessesView,revenue,subscriptions,support,analytics,health,settings}[v]||overview)();bindJumps()}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.getElementById("roleSelect").onchange=e=>{document.body.dataset.role=e.target.value;alert("Role simulator: "+e.target.value+"\\nReal permissions will be enforced by the backend later.")};navigate("overview");
</script></body></html>
